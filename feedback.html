<main>



    <section class="container">


        <article class="paper">

            <h2>Feedback</h2>


            <form action="#" method="post">


                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="feedback">
                    Your Feedback
                </label>

                <textarea
                    id="feedback"
                    name="feedback"
                    rows="6"
                    placeholder="Write your feedback here..."
                    required
                ></textarea>


                <input
                    type="submit"
                    value="Submit Feedback"
                >


            </form>


        </article>


    </section>


</main>
